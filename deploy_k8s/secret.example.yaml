# Example Secret for AMCP runtime configuration.
#
# DO NOT apply this file directly and DO NOT commit real credentials.
# Copy it to secret.yaml (gitignored), fill in real values, then apply:
#   cp deploy_k8s/secret.example.yaml deploy_k8s/secret.yaml
#   kubectl apply -f deploy_k8s/secret.yaml
#
# Or create it imperatively:
#   kubectl -n amcp create secret generic amcp-env \
#     --from-literal=OPENAI_API_KEY='<your-api-key>' \
#     --from-literal=AMCP_CHAT_MODEL='<model-name>' \
#     --from-literal=AMCP_OPENAI_BASE='https://api.gmi-serving.com/v1'
#
# All keys are injected as environment variables (envFrom: secretRef) and are
# consumed by the gmi-entrypoint:
#   OPENAI_API_KEY      (required) API key for the OpenAI-compatible provider.
#                       GMI_MAAS_API_KEY is also accepted and mapped to it.
#   AMCP_CHAT_MODEL     (required) Chat model name, e.g. "zai-org/GLM-5.2-FP8".
#                       GMI_MODELS is also accepted (first entry wins).
#   AMCP_OPENAI_BASE    (optional) Provider base URL; the entrypoint derives it
#                       from GMI_MAAS_BASE_URL, defaulting to
#                       https://api.gmi-serving.com/v1.
#   AMCP_TELEGRAM_BOT_TOKEN / AMCP_TELEGRAM_ALLOWED_USERS (optional) enable the
#                       Telegram polling bot. Single replica only.
apiVersion: v1
kind: Secret
metadata:
  name: amcp-env
  namespace: amcp
  labels:
    app: amcp
type: Opaque
